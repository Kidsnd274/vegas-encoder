; vegas-encoder.ini - read from the folder containing vegas-encoder.dll at first use.
; Changes take effect after VEGAS restarts. Numbers accept 0x prefixes.
[vegas-encoder]
; Simple proof: one fixed profile (FFV1 10-bit + float PCM, Matroska).
; Restart VEGAS after changing this file. "raw" restores diagnostic output.
OutputMode=ffmpeg
; Development trial only: 1 exposes container-specific exporter classes for
; older hosts such as VEGAS 23. Default 0 retains the VEGAS 2026 integration.
; Restart VEGAS after changing this setting. Setup never enables it.
LegacyContainers=0
; Experimental one-format alternative for 23: leaves File column empty and
; preserves a full filename typed with the recipe's required suffix. Overrides
; LegacyContainers. Actual discovery/manual naming still needs a host trial.
LegacyManualNames=0
; Older VEGAS (23 and earlier): one format whose Render As suffix is the
; placeholder .vencoder; the selected recipe determines the actual file extension.
; Overrides both experimental flags above. 0 keeps the VEGAS 2026 behavior.
; Setup writes 0 for 2026 and 1 for 23; owner-tested on 23.0.0.278 (2026-11-05).
LegacyAutoNames=0
FFmpegPath=C:\ffmpeg\bin\ffmpeg.exe
ShowEncoderErrors=1
; Cancellable deadlines for pipe operations/queue waits and finalization.
PipeTimeoutMs=10000
FinishTimeoutMs=120000
; Per-process call logs. Default: %LOCALAPPDATA%\vegas-encoder
;LogDir=
; Discovery answers (F-038). Access 0x20 = render-only, like Voukoder Classic;
; stream types and caps copy Voukoder Pro's runtime-observed answers on VEGAS 2026.
Access=0x20
StreamTypes=0x0B
Caps=0x100006
PluginFlags=0x1
; 0 skips writing the raw files (frames/samples are still fetched and counted).
WriteVideo=1
WriteAudio=1
; Call out-only stream getters once per render and record their results.
ProbeGetters=1
; Full template hex dumps per method before switching to one-line summaries.
DetailCalls=12
